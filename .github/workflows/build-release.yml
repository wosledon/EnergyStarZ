name: Build and Release

on:
  push:
    branches: [ main, master, refactor/improvements ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: src/EnergyStarZ/EnergyStarZ.csproj
  OUTPUT_DIR: publish

jobs:
  build:
    name: Build ${{ matrix.runtime }}-${{ matrix.arch }}
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          # x64 自带运行时
          - arch: x64
            runtime: win-x64
            self_contained: true
            compress: true
            label: x64-SelfContained
          
          # x64 框架依赖
          - arch: x64
            runtime: win-x64
            self_contained: false
            compress: false
            label: x64-FrameworkDependent
          
          # x86 自带运行时
          - arch: x86
            runtime: win-x86
            self_contained: true
            compress: true
            label: x86-SelfContained
          
          # x86 框架依赖
          - arch: x86
            runtime: win-x86
            self_contained: false
            compress: false
            label: x86-FrameworkDependent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r ${{ matrix.runtime }} `
            -o "${{ env.OUTPUT_DIR }}/${{ matrix.label }}" `
            --self-contained ${{ matrix.self_contained }} `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=${{ matrix.compress }} `
            -p:DebugType=none

      - name: Create ZIP archive
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/v(.*)') { $matches[1] } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zipName = "EnergyStarZ-${{ matrix.label }}-$version.zip"
          Compress-Archive -Path "${{ env.OUTPUT_DIR }}/${{ matrix.label }}/*" -DestinationPath "${{ env.OUTPUT_DIR }}/$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.OUTPUT_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 发版说明 = 标签备注（本次亮点，打标签时写） + 固定尾部模板 + 自动变更日志
      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          # checkout 默认可能只取到提交而非带注释的标签对象，
          # 这里显式抓取，否则 %(contents) 会回退成提交标题
          git fetch --force origin "refs/tags/${tag}:refs/tags/$tag"
          $version = $tag -replace '^v',''
          $footer = (Get-Content -Raw -Encoding utf8 '.github/release-template.md') -replace '\{VERSION\}', $version
          $highlights = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $highlights) {
            Write-Warning "No tag annotation found for $tag; using footer only."
          }
          if ($highlights) {
            "$highlights`n`n---`n`n$footer" | Out-File -FilePath release-notes.md -Encoding utf8
          } else {
            $footer | Out-File -FilePath release-notes.md -Encoding utf8
          }
          Get-Content -Raw release-notes.md | Write-Host

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
